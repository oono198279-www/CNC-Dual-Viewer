    *{box-sizing:border-box}html,body{width:100%;height:100%;height:100dvh;margin:0;background:var(--bg);color:var(--text);overflow:hidden}button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);background:#162331;border-radius:5px;padding:8px 12px;cursor:pointer}button:hover{background:#1d3041;border-color:#486078}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.primary{background:#087cd4;border-color:#199af8}.primary:hover{background:#128fea}.icon{width:18px;height:18px;vertical-align:-4px;margin-right:7px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    #app{height:100%;height:100dvh;min-height:0;display:grid;grid-template-rows:52px auto minmax(0,1fr) 28px}.topbar{display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);background:#101923}.brand{font-size:19px;font-weight:650;letter-spacing:.01em;margin-right:auto;white-space:nowrap}.brand small{font-size:11px;color:var(--muted);font-weight:500;margin-left:9px}.topbar button{height:36px;padding:6px 10px;background:transparent}.topbar button:hover{background:#1a2937}.topbar.warning{background:#32151a;border-color:#8b343d}.topbar.warning .brand small{color:#ffc2c7}.settings-warn{border-color:var(--red)!important;color:#ffd1d5!important;background:#351a20!important}
    .notice{display:none;align-items:center;justify-content:space-between;gap:16px;padding:7px 16px;font-size:13px;background:#4a1e24;color:#ffd9dc;border-bottom:1px solid #9a3944}.notice.show{display:flex}.notice button{padding:4px 9px;background:#642831;border-color:#a94d58}.workspace{display:grid;grid-template-columns:minmax(0,var(--split)) 9px minmax(0,calc(100% - var(--split) - 9px));min-height:0}.divider{position:relative;background:#1d2b38;cursor:col-resize;border-left:1px solid #314252;border-right:1px solid #314252;touch-action:none}.divider:after{content:"";position:absolute;left:3px;top:50%;height:42px;border-left:2px dotted #8da0b2;transform:translateY(-50%)}.divider:hover{background:#31506a}
    .pane{display:grid;grid-template-rows:54px minmax(0,1fr);min-width:0;min-height:0;background:var(--panel)}.pane-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);min-width:0}.pane-title{font-weight:700;font-size:16px;min-width:46px}.filename{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.file-btn{margin-left:auto;white-space:nowrap;padding:7px 10px}.encoding{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:#a9bac9;border:1px solid #344758;border-radius:4px;padding:4px 6px;white-space:nowrap}.viewer{position:relative;overflow:auto;min-width:0;min-height:0;background:#0c141c;scrollbar-color:#66798b #192532;scrollbar-width:thin;overscroll-behavior:contain;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}.code{display:table;min-width:100%;width:max-content;padding:7px 0 18px;font:13px/var(--lh) ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-variant-ligatures:none}.row{display:table-row;height:var(--lh)}.row.wait{background:#19334a}.row.wait .content{color:var(--amber);font-weight:700}.row.virtual .content{color:#718395;text-align:center;font-weight:700;letter-spacing:.18em}.row.tail .content{color:transparent}.ln,.content{display:table-cell;height:var(--lh);white-space:pre}.ln{position:sticky;left:0;z-index:1;width:54px;min-width:54px;text-align:right;padding-right:11px;color:#6f8191;background:#0e1821;border-right:1px solid #1d2b38;user-select:none}.row.wait .ln{background:#172f43;color:#aab7c2}.content{padding:0 18px 0 13px;color:#d9e2ea}.tok-comment{color:var(--comment)}.tok-g{color:var(--gcode)}.tok-m{color:var(--mcode)}.tok-axis{color:var(--coord)}.tok-feed{color:var(--feed)}.tok-tool{color:var(--tool)}.tok-num{color:#d8e4ee}.tok-n{color:#aa8cf2}.eob{color:#758695;margin-left:5px}.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--muted);pointer-events:none}.empty strong{color:#cad5df;font-size:16px;margin-bottom:7px}.empty span{font-size:12px}.pane.loaded .empty{display:none}
    .statusbar{display:flex;align-items:center;gap:13px;padding:0 13px;border-top:1px solid var(--line);background:#101923;color:#9cadbd;font-size:11px;white-space:nowrap;overflow:hidden}.statusbar .state{color:var(--green)}.statusbar .pending{color:var(--amber)}.statusbar .error{color:var(--red)}.status-spacer{margin-left:auto}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px}
    dialog{width:min(470px,calc(100vw - 28px));max-height:calc(100vh - 32px);padding:0;border:1px solid #3b4d5e;border-radius:7px;background:#111c26;color:var(--text);box-shadow:0 22px 80px #000b}dialog::backdrop{background:#05080ba8}.dialog-head{display:flex;align-items:center;padding:14px 17px;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:17px;margin:0}.close{margin-left:auto;border:0;background:transparent;font-size:21px;padding:2px 7px}.settings-body{padding:14px 17px;overflow:auto}.group{border:0;border-bottom:1px solid var(--line);padding:0 0 13px;margin:0 0 13px}.group legend{font-size:13px;font-weight:700;padding:0 0 10px}.field{display:grid;grid-template-columns:1fr 160px;align-items:center;gap:12px;margin:9px 0;font-size:13px}.field input,.field select{width:100%;padding:7px 9px;background:#0d1720;border:1px solid #3a4c5d;border-radius:4px}.field input:disabled{opacity:.5}.toggle{justify-self:end;position:relative;width:42px;height:23px}.toggle input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#3d4b57;border-radius:20px;transition:.15s}.slider:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:white;border-radius:50%;transition:.15s}.toggle input:checked+.slider{background:var(--blue)}.toggle input:checked+.slider:before{transform:translateX(19px)}.toggle input:disabled+.slider{opacity:.38}.validation{min-height:18px;color:var(--red);font-size:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;padding:12px 17px;border-top:1px solid var(--line)}
    #detailDialog pre{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;background:#0b131a;padding:12px;border:1px solid var(--line);max-height:55vh;overflow:auto}.toast{position:fixed;left:50%;bottom:42px;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#203142;border:1px solid #4b6379;border-radius:5px;padding:9px 14px;font-size:12px;transition:.18s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
    .print-root{display:none}
    @media(max-width:760px) and (orientation:portrait){.brand small,.encoding{display:none}.topbar{padding:0 8px}.topbar button span{display:none}.topbar button .icon{margin:0}.pane-head{padding:7px}.pane-title{font-size:14px;min-width:42px}.file-btn{font-size:11px;padding:6px}.workspace{grid-template-columns:1fr;grid-template-rows:minmax(260px,1fr) 9px minmax(260px,1fr);overflow:auto}.divider{cursor:row-resize}.divider:after{top:3px;left:50%;height:auto;width:42px;border-left:0;border-top:2px dotted #8da0b2;transform:translateX(-50%)}body{overflow:auto;height:auto;min-height:100dvh}#app{height:auto;min-height:100dvh}.statusbar{position:sticky;bottom:0}.field{grid-template-columns:1fr 130px}}
    @media(orientation:landscape) and (max-height:520px){#app{grid-template-rows:42px auto minmax(0,1fr) 24px}.topbar{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}.topbar button{height:32px;padding:4px 8px}.brand{font-size:16px}.brand small,.topbar button span,.encoding{display:none}.topbar button .icon{margin:0}.workspace{grid-template-columns:minmax(0,var(--split)) 7px minmax(0,calc(100% - var(--split) - 7px));grid-template-rows:minmax(0,1fr);overflow:hidden}.pane{grid-template-rows:42px minmax(0,1fr)}.pane-head{padding:5px 7px;gap:6px}.pane-title{font-size:13px;min-width:38px}.file-btn{font-size:10px;padding:5px 7px}.code{font-size:12px}.statusbar{font-size:9px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}}
    @media print{html,body{height:auto;overflow:visible;background:white;color:black}.topbar,.notice,.workspace,.statusbar,dialog,.toast{display:none!important}.print-root{display:block;color:#111;background:white;font:8pt/1.25 "Courier New",monospace}.print-head{display:grid;grid-template-columns:1fr auto;margin-bottom:7mm;border-bottom:1px solid #333;padding-bottom:2mm}.print-head h1{font:700 13pt "Segoe UI",sans-serif;margin:0}.print-meta{text-align:right;font:8pt "Segoe UI",sans-serif}.print-files{display:grid;grid-template-columns:1fr 1fr;font-weight:bold;border:1px solid #555;border-bottom:0}.print-files div{padding:1.5mm}.print-files div+div{border-left:1px solid #555}.print-table{width:100%;border-collapse:collapse;table-layout:fixed}.print-table td{width:50%;vertical-align:top;border:1px solid #888;padding:0 1mm;white-space:nowrap;overflow:hidden;height:4mm}.print-table .pln{display:inline-block;width:8mm;text-align:right;color:#555;padding-right:2mm;border-right:1px solid #bbb;margin-right:2mm}.print-table tr.wait td{font-weight:bold;background:#ddd!important;border-top:1.5px solid #111;border-bottom:1.5px solid #111}.print-table tr.virtual td{color:#777;text-align:center}.print-table tr.virtual .pln{text-align:right}.print-color .tok-g{color:#5b3cb2}.print-color .tok-axis{color:#00718e}.print-color .tok-m{color:#945f00}.print-color .tok-feed{color:#a84c00}.print-color .tok-tool{color:#a00063}.print-color .tok-comment{color:#257135}.print-color .tok-n{color:#55408c}@page{size:A4 portrait;margin:10mm}}
  </style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <div class="brand">CNC Dual Viewer <small id="headerState">ファイルを選択してください</small></div>
    <button id="refreshBtn" title="読み込んだファイルを更新"><svg class="icon" viewBox="0 0 24 24"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M6.1 9A7 7 0 0 1 18.8 7.5L20 11M4 13l1.2 3.5A7 7 0 0 0 17.9 15"/></svg><span>更新</span></button>
    <button id="printBtn"><svg class="icon" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg><span>印刷</span></button>
    <button id="settingsBtn"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.6v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3V9.6h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.17.36.49.72 1 .94.35.16.73.22 1.1.16h.1v4h-.1a1.7 1.7 0 0 0-1.1.4z"/></svg><span>設定</span></button>
  </header>
  <div class="notice" id="notice"><span id="noticeText"></span><button id="detailBtn">詳細を確認</button></div>
  <main class="workspace" id="workspace">
    <section class="pane" id="mainPane"><div class="pane-head"><div class="pane-title">MAIN</div><div class="filename" id="mainName">未選択</div><span class="encoding" id="mainEncoding">—</span><button class="file-btn primary" data-side="main"><svg class="icon" viewBox="0 0 24 24"><path d="M3 5h6l2 2h10v12H3z"/></svg>ファイルを開く</button><input id="mainInput" type="file" hidden></div><div class="viewer" id="mainViewer"><div class="empty"><strong>MAINプログラム</strong><span>拡張子を問わずテキストファイルを読み込めます</span></div><div class="code" id="mainCode"></div></div></section>
    <div class="divider" id="divider" title="ドラッグで幅変更・ダブルクリックで50:50"></div>
    <section class="pane" id="backPane"><div class="pane-head"><div class="pane-title">BACK</div><div class="filename" id="backName">未選択</div><span class="encoding" id="backEncoding">—</span><button class="file-btn primary" data-side="back"><svg class="icon" viewBox="0 0 24 24"><path d="M3 5h6l2 2h10v12H3z"/></svg>ファイルを開く</button><input id="backInput" type="file" hidden></div><div class="viewer" id="backViewer"><div class="empty"><strong>BACKプログラム</strong><span>ファイル内容は外部へ送信されません</span></div><div class="code" id="backCode"></div></div></section>
  </main>
  <footer class="statusbar"><span id="statusState" class="pending"><i class="dot"></i>判定待ち</span><span id="statusMessage">MAINとBACKを選択してください</span><span class="status-spacer"></span><span id="lineCounts">MAIN: —　BACK: —</span></footer>
</div>
<dialog id="settingsDialog"><div class="dialog-head"><h2>設定</h2><button class="close" data-close="settingsDialog" aria-label="閉じる">×</button></div><form id="settingsForm"><div class="settings-body"><fieldset class="group"><legend>待合わせコード</legend><label class="field"><span>頭文字</span><input id="waitPrefix" maxlength="1" required></label><label class="field"><span>開始番号</span><input id="waitStart" type="number" step="1" required></label><label class="field"><span>終了番号</span><input id="waitEnd" type="number" step="1" required></label><div class="validation" id="settingsError"></div></fieldset><fieldset class="group"><legend>表示・スクロール</legend><label class="field"><span>同期スクロール</span><span class="toggle"><input id="syncScroll" type="checkbox"><span class="slider"></span></span></label><label class="field"><span>待合わせ位置合わせ</span><span class="toggle"><input id="alignWait" type="checkbox"><span class="slider"></span></span></label><label class="field"><span>シンタックスハイライト</span><span class="toggle"><input id="syntaxHighlight" type="checkbox"><span class="slider"></span></span></label><label class="field"><span>EOB表示</span><span class="toggle"><input id="showEob" type="checkbox"><span class="slider"></span></span></label></fieldset><fieldset class="group"><legend>ファイル・印刷</legend><label class="field"><span>印刷カラー</span><select id="printColor"><option value="mono">モノクロ</option><option value="color">カラー</option></select></label><label class="field"><span>文字コード</span><select id="encodingMode"><option value="auto">自動</option><option value="utf-8">UTF-8</option><option value="shift_jis">Shift_JIS</option></select></label></fieldset></div><div class="dialog-actions"><button type="button" data-close="settingsDialog">キャンセル</button><button class="primary" type="submit">適用</button></div></form></dialog>
<dialog id="detailDialog"><div class="dialog-head"><h2>待合わせコード検出結果</h2><button class="close" data-close="detailDialog">×</button></div><div class="settings-body"><pre id="detailText"></pre></div><div class="dialog-actions"><button class="primary" data-close="detailDialog">閉じる</button></div></dialog>
<div class="toast" id="toast"></div><section class="print-root" id="printRoot"></section>
<script>
(() => {
  'use strict';
  const DEFAULTS={prefix:'M',start:500,end:600,sync:true,align:true,highlight:true,eob:true,printColor:'mono',encoding:'auto',ratio:50};
  const READ_PERMISSION=Object.freeze({mode:'read'});
  const saved=(()=>{try{return JSON.parse(localStorage.getItem('cncDualViewer.settings')||'{}')}catch{return {}}})();
  let settings={...DEFAULTS,...saved};
  const state={main:emptySide(),back:emptySide(),comparison:{status:'pending',message:'',mismatch:-1},syncing:false};
  function emptySide(){return {file:null,handle:null,name:'',bytes:null,text:'',encoding:'',lines:[],waits:[],display:[]}}
  const $=id=>document.getElementById(id), els={topbar:$('topbar'),notice:$('notice'),noticeText:$('noticeText'),headerState:$('headerState'),statusState:$('statusState'),statusMessage:$('statusMessage'),lineCounts:$('lineCounts'),settingsBtn:$('settingsBtn'),mainViewer:$('mainViewer'),backViewer:$('backViewer'),mainCode:$('mainCode'),backCode:$('backCode'),workspace:$('workspace'),divider:$('divider')};
  function persist(){localStorage.setItem('cncDualViewer.settings',JSON.stringify(settings))}
  function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function stripComments(line){let depth=0,out='';for(const ch of line){if(ch==='('){depth++;continue}if(ch===')'&&depth){depth--;continue}if(!depth)out+=ch}return out}
  function waitRegex(){return new RegExp('(?:^|[^A-Z0-9])'+settings.prefix+'(\\d+)(?!\\d)','ig')}
  function findWait(line){const clean=stripComments(line).toUpperCase();const re=waitRegex();let m;const found=[];while((m=re.exec(clean))){const n=Number(m[1]);if(n>=settings.start&&n<=settings.end)found.push(settings.prefix+n)}return found}
  function parseText(text){const normalized=text.replace(/\r\n?/g,'\n');const raw=normalized.split('\n');if(raw.length>1&&raw.at(-1)==='')raw.pop();const lines=raw.map((text,i)=>({kind:'real',text,no:i+1,waits:findWait(text)}));const waits=[];for(const l of lines)for(const code of l.waits)waits.push({code,line:l.no,index:waits.length});return {lines,waits}}
  function binaryScore(bytes){if(!bytes.length)return 0;let bad=0;for(const b of bytes)if(b===0||(b<7)||(b>13&&b<32))bad++;return bad/bytes.length}
  function decode(bytes,mode){const tryDecode=enc=>{try{return new TextDecoder(enc,{fatal:true}).decode(bytes)}catch{return null}};if(mode!=='auto'){const t=tryDecode(mode);return t==null?{error:mode+'として読み込めません'}:{text:t,encoding:mode==='utf-8'?'UTF-8':'Shift_JIS'}}let t=tryDecode('utf-8');if(t!=null)return {text:t,encoding:'UTF-8'};t=tryDecode('shift_jis');if(t!=null)return {text:t,encoding:'Shift_JIS'};return {error:'UTF-8 / Shift_JISとして判定できません'} }
  async function loadFile(side,file,handle=null){const bytes=new Uint8Array(await file.arrayBuffer());if(binaryScore(bytes)>.015){if(!confirm('制御文字が多く、バイナリファイルの可能性があります。表示を試みますか？'))return}const decoded=decode(bytes,settings.encoding);if(decoded.error){toast(decoded.error,true);return}const parsed=parseText(decoded.text);Object.assign(state[side],{file,handle,name:file.name||'名称なし',bytes,text:decoded.text,encoding:decoded.encoding,...parsed});renderAll();toast(side.toUpperCase()+'を読み込みました')}
  async function chooseFile(side){try{if('showOpenFilePicker'in window){const [h]=await showOpenFilePicker({multiple:false});const f=await h.getFile();await loadFile(side,f,h)}else $(side+'Input').click()}catch(e){if(e.name!=='AbortError')toast('ファイルを開けませんでした: '+e.message,true)}}
  function compare(){const a=state.main.waits,b=state.back.waits;if(!state.main.file||!state.back.file)return {status:'pending',message:'両方のファイルを選択すると判定します',mismatch:-1};const min=Math.min(a.length,b.length);for(let i=0;i<min;i++)if(a[i].code!==b[i].code)return {status:'error',message:`${i+1}個目が不一致: MAIN ${a[i].code} / BACK ${b[i].code}`,mismatch:i};if(a.length!==b.length)return {status:'error',message:`検出件数が不一致: MAIN ${a.length}件 / BACK ${b.length}件`,mismatch:min};return {status:'ok',message:`待合わせコード ${a.length}件を照合しました`,mismatch:-1}}
  function virtual(){return {kind:'virtual',text:'…',no:null,waits:[]}}function tail(){return {kind:'tail',text:'',no:null,waits:[]}}
  function alignLines(){const a=state.main.lines,b=state.back.lines,ao=[],bo=[];let ai=0,bi=0;const aw=state.main.waits,bw=state.back.waits;for(let k=0;k<aw.length;k++){const aidx=aw[k].line-1,bidx=bw[k].line-1;const ac=aidx-ai,bc=bidx-bi,span=Math.max(ac,bc);ao.push(...a.slice(ai,aidx),...Array(span-ac).fill(0).map(virtual),a[aidx]);bo.push(...b.slice(bi,bidx),...Array(span-bc).fill(0).map(virtual),b[bidx]);ai=aidx+1;bi=bidx+1}ao.push(...a.slice(ai));bo.push(...b.slice(bi));const max=Math.max(ao.length,bo.length);while(ao.length<max)ao.push(tail());while(bo.length<max)bo.push(tail());return [ao,bo]}
  function highlight(line){const source=line.text;const eob=settings.eob&&source.trim()&&!source.trimEnd().endsWith(';');if(!settings.highlight)return escapeHtml(source)+(eob?'<span class="eob">;</span>':'');let out='',last=0;const comments=[];source.replace(/\([^)]*\)/g,(m,o)=>{comments.push([o,o+m.length,m]);return m});for(const [s,e,c] of comments){out+=tokenize(source.slice(last,s));out+='<span class="tok-comment">'+escapeHtml(c)+'</span>';last=e}out+=tokenize(source.slice(last));return out+(eob?'<span class="eob">;</span>':'')}
  function tokenize(s){let x=escapeHtml(s);return x.replace(/\b([GMTNFSXYZABCUVWIJKRPQ])([+-]?(?:\d+(?:\.\d*)?|\.\d+))/gi,(m,l,n)=>{const c=l.toLowerCase();const kind=c==='g'?'g':c==='m'?'m':c==='n'?'n':c==='f'||c==='s'?'feed':c==='t'?'tool':'axis';return `<span class="tok-${kind}">${l}${n}</span>`})}
  function rowHtml(l){const wait=l.kind==='real'&&l.waits.length;return `<div class="row ${l.kind}${wait?' wait':''}"><span class="ln">${l.no??''}</span><span class="content">${l.kind==='real'?highlight(l):escapeHtml(l.text)}</span></div>`}
  function renderSide(side){const s=state[side],code=$(side+'Code'),pane=$(side+'Pane');pane.classList.toggle('loaded',!!s.file);$(side+'Name').textContent=s.name||'未選択';$(side+'Encoding').textContent=s.encoding||'—';code.innerHTML=s.display.map(rowHtml).join('')}
  function renderAll(){state.comparison=compare();if(state.comparison.status==='error')settings.align=false;const aligned=settings.align&&state.comparison.status==='ok';if(aligned)[state.main.display,state.back.display]=alignLines();else{state.main.display=[...state.main.lines];state.back.display=[...state.back.lines]}renderSide('main');renderSide('back');renderStatus();persist()}
  function renderStatus(){const c=state.comparison;els.topbar.classList.toggle('warning',c.status==='error');els.notice.classList.toggle('show',c.status==='error');els.settingsBtn.classList.toggle('settings-warn',c.status==='error');els.noticeText.textContent=c.status==='error'?'待合わせコードに不整合があります。位置合わせ機能を無効にしました。':'';els.headerState.textContent=c.status==='ok'?'待合わせ照合OK':c.status==='error'?'待合わせ不整合':'ファイル選択待ち';els.statusState.className=c.status==='ok'?'state':c.status==='error'?'error':'pending';els.statusState.innerHTML=`<i class="dot"></i>${c.status==='ok'?'比較完了':c.status==='error'?'不整合':'判定待ち'}`;els.statusMessage.textContent=c.message;els.lineCounts.textContent=`MAIN: ${state.main.file?state.main.lines.length+'行':'—'}　BACK: ${state.back.file?state.back.lines.length+'行':'—'}`;$('alignWait').disabled=c.status==='error'}
  function detail(){const fmt=s=>s.waits.length?s.waits.map((w,i)=>`${i+1}. ${w.code}（元ファイル ${w.line}行）`).join('\n'):'（検出なし）';$('detailText').textContent=`判定: ${state.comparison.message}\n\nMAIN\n${fmt(state.main)}\n\nBACK\n${fmt(state.back)}`;$('detailDialog').showModal()}
  function syncSettingsForm(){$('waitPrefix').value=settings.prefix;$('waitStart').value=settings.start;$('waitEnd').value=settings.end;$('syncScroll').checked=settings.sync;$('alignWait').checked=settings.align;$('syntaxHighlight').checked=settings.highlight;$('showEob').checked=settings.eob;$('printColor').value=settings.printColor;$('encodingMode').value=settings.encoding;$('alignWait').disabled=state.comparison.status==='error';$('settingsError').textContent=state.comparison.status==='error'?'不整合が解消するまで位置合わせはONにできません。':''}
  async function refresh(){const savedScroll={main:[els.mainViewer.scrollTop,els.mainViewer.scrollLeft],back:[els.backViewer.scrollTop,els.backViewer.scrollLeft]};let count=0;for(const side of ['main','back']){const s=state[side];if(!s.file)continue;try{let f;if(s.handle){if((await s.handle.queryPermission?.(READ_PERMISSION))!=='granted'&&(await s.handle.requestPermission?.(READ_PERMISSION))!=='granted')throw new Error('読み込み権限がありません');f=await s.handle.getFile()}else throw new Error('このブラウザでは再選択が必要です');await loadFile(side,f,s.handle);count++}catch(e){toast(`${side.toUpperCase()}: ${e.message}。ファイルを再選択してください。`,true)}}requestAnimationFrame(()=>{els.mainViewer.scrollTo(savedScroll.main[1],savedScroll.main[0]);els.backViewer.scrollTo(savedScroll.back[1],savedScroll.back[0])});if(count)toast(count+'ファイルを更新しました')}
  function preparePrint(){const rows=Math.max(state.main.display.length,state.back.display.length);let body='';let clipped=0;for(let i=0;i<rows;i++){const a=state.main.display[i]||tail(),b=state.back.display[i]||tail();if(a.text.length>72||b.text.length>72)clipped++;const cls=(a.waits?.length||b.waits?.length)?'wait':(a.kind==='virtual'||b.kind==='virtual')?'virtual':'';const cell=l=>`<td><span class="pln">${l.no??''}</span>${l.kind==='real'?highlight(l):escapeHtml(l.text)}</td>`;body+=`<tr class="${cls}">${cell(a)}${cell(b)}</tr>`}$('printRoot').className='print-root '+(settings.printColor==='color'?'print-color':'');$('printRoot').innerHTML=`<div class="print-head"><h1>CNC Dual Viewer</h1><div class="print-meta">印刷日時: ${new Date().toLocaleString('ja-JP')}<br>待合わせ位置合わせ: ${settings.align&&state.comparison.status==='ok'?'ON':'OFF'}</div></div><div class="print-files"><div>MAIN: ${escapeHtml(state.main.name||'未選択')}</div><div>BACK: ${escapeHtml(state.back.name||'未選択')}</div></div><table class="print-table"><tbody>${body}</tbody></table>`;return clipped}
  function printView(){if(!state.main.file&&!state.back.file){toast('印刷するファイルがありません',true);return}const clipped=preparePrint();if(clipped&&!confirm(`${clipped}行が用紙幅を超え、省略される可能性があります。印刷を続けますか？`))return;window.print()}
  let toastTimer;function toast(msg,error=false){const t=$('toast');t.textContent=msg;t.style.borderColor=error?'#9b3b46':'';t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
  document.querySelectorAll('.file-btn').forEach(b=>b.onclick=()=>chooseFile(b.dataset.side));for(const side of ['main','back'])$(side+'Input').onchange=e=>{const f=e.target.files[0];if(f)loadFile(side,f);e.target.value=''};
  els.settingsBtn.onclick=()=>{syncSettingsForm();$('settingsDialog').showModal()};$('detailBtn').onclick=detail;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('refreshBtn').onclick=refresh;$('printBtn').onclick=printView;
  $('settingsForm').onsubmit=async e=>{e.preventDefault();const prefix=$('waitPrefix').value.trim().toUpperCase(),start=Number($('waitStart').value),end=Number($('waitEnd').value);if(!/^[A-Z]$/.test(prefix)||!Number.isInteger(start)||!Number.isInteger(end)||start>end){$('settingsError').textContent='頭文字は英字1文字、番号は開始≦終了の整数で入力してください。';return}Object.assign(settings,{prefix,start,end,sync:$('syncScroll').checked,align:$('alignWait').checked,highlight:$('syntaxHighlight').checked,eob:$('showEob').checked,printColor:$('printColor').value,encoding:$('encodingMode').value});for(const side of ['main','back'])if(state[side].file){if(state[side].bytes){const d=decode(state[side].bytes,settings.encoding);if(d.error){toast(side.toUpperCase()+': '+d.error,true);continue}Object.assign(state[side],{text:d.text,encoding:d.encoding,...parseText(d.text)})}else Object.assign(state[side],parseText(state[side].text))}renderAll();$('settingsDialog').close()};
  function onScroll(source,target){if(!settings.sync||state.syncing)return;state.syncing=true;target.scrollTop=source.scrollTop;requestAnimationFrame(()=>state.syncing=false)}els.mainViewer.addEventListener('scroll',()=>onScroll(els.mainViewer,els.backViewer));els.backViewer.addEventListener('scroll',()=>onScroll(els.backViewer,els.mainViewer));
  let drag=false;els.divider.onpointerdown=e=>{if(innerWidth<=760)return;drag=true;els.divider.setPointerCapture(e.pointerId)};els.divider.onpointermove=e=>{if(!drag)return;const r=els.workspace.getBoundingClientRect();settings.ratio=Math.max(20,Math.min(80,(e.clientX-r.left)/r.width*100));document.documentElement.style.setProperty('--split',settings.ratio+'%')};els.divider.onpointerup=()=>{drag=false;persist()};els.divider.ondblclick=()=>{settings.ratio=50;document.documentElement.style.setProperty('--split','50%');persist()};
  document.documentElement.style.setProperty('--split',settings.ratio+'%');renderAll();
  window.CNC_DUAL_VIEWER_TEST={stripComments,findWait,parseText,alignLines,decode,binaryScore,getState:()=>state,setSettings:x=>{Object.assign(settings,x);for(const s of ['main','back'])if(state[s].text)Object.assign(state[s],parseText(state[s].text));renderAll()},loadText:(side,text,name='test.nc')=>{Object.assign(state[side],{file:{name},name,text,encoding:'UTF-8',...parseText(text)});renderAll()},reset:()=>{state.main=emptySide();state.back=emptySide();renderAll()}};
  const demo=new URLSearchParams(location.search).get('demo');
  if(demo){
    const main=`%\nO1000 (架空 MAIN PROGRAM)\nG90 G54 G17\nT1 S2000 M03\nG00 X0 Y0 Z100.\n(COMMENT M599 IS NOT A WAIT)\nG01 X10. Y10. F300.\nG01 X123.456 Z-78.901 U0.123 W-0.456 F120. S1800 (LONG HORIZONTAL SCROLL TEST LINE)\nM500 (WAIT 1)\nG00 Z50.\nG01 X50. Y50.\nG01 X80. Y50.\nM560 (WAIT 2)\nG00 Z100.\nM500 (WAIT 3)\nM30\n%`;
    const backNormal=`%\nO2000 (架空 BACK PROGRAM)\nG90 G54 G17\nG00 X0 Y0 Z100.\nG01 X12. Y12. F300.\nG01 X20. Y20.\nG01 X30. Y30.\nM500 (WAIT 1)\nG00 Z50.\nM5000 (NOT A WAIT)\nM560 (WAIT 2)\nG00 Z100.\nG01 X90. Y90.\nG01 X100. Y100.\nM500 (WAIT 3)\nG01 X120. Y120.\nG00 Z150.\nM30\n%`;
    const backMismatch=`%\nO2001 (架空 MISMATCH)\nM500\nG00 X10.\nM550\nG00 X20.\nM560\nM30\n%`;
    window.CNC_DUAL_VIEWER_TEST.loadText('main',main,'main-normal.nc');window.CNC_DUAL_VIEWER_TEST.loadText('back',demo==='mismatch'?backMismatch:backNormal,demo==='mismatch'?'back-order-mismatch.prg':'back-normal');
  }
  if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).catch(e=>console.warn('Service worker registration failed:',e)));
})();
